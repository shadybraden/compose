---
name: squid
services:
  squid:
    image: git.holmlab.org/shady/squid:7.2-26.04_edge@sha256:cd6c97d847297e18ffe5ea6ef930b62472a75f588a270fd9ce8a6af59ee7b534
    container_name: squid
    volumes:
      - /data/config_storage/komodo/etc_komodo/repos/compose_main/squid/squid.conf:/etc/squid/squid.conf:ro
    environment:
      - TZ=America/New_York
    ports:
      - '0.0.0.0:3128:3128/tcp'
    networks:
      - squid
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  squid:  # dedicated network, not shared with intranet/intranet-backend
    driver: bridge
    name: squid
