# Squid proxy: only allow HTTPS (CONNECT on 443) to Fedora CoreOS update hosts.
# updates.coreos.fedoraproject.org: Zincati update graph
# ostree.fedoraproject.org: OSTree OS commits
# builds.coreos.fedoraproject.org: FCOS build metadata
# quay.io and subdomains: OS image registry used by rpm-ostree

http_port 3128

acl fcos_updates dstdomain updates.coreos.fedoraproject.org ostree.fedoraproject.org builds.coreos.fedoraproject.org .quay.io
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access allow CONNECT SSL_ports fcos_updates
http_access deny all

# CONNECT tunnels are not cacheable, so disable caching entirely
cache deny all

# verify with:
# curl -s -o /dev/null -w '%{http_code}\n' -x http://10.1.1.65:3128 https://holmlab.org