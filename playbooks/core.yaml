- name: Bootstrap Core (no Python yet)
  hosts: core
  become: true
  gather_facts: false
  tasks:
    - name: Check for python3
      ansible.builtin.raw: test -x /usr/bin/python3
      register: python_check
      changed_when: false
      failed_when: false

    - name: Layer python3 and podman-compose
      ansible.builtin.raw: rpm-ostree install --idempotent python3 podman-compose
      when: python_check.rc != 0
      register: layer_install

    - name: Reboot to apply layered packages
      ansible.builtin.raw: systemctl reboot
      become: true
      when: layer_install is changed
      failed_when: false

    - name: Give the host time to go down
      ansible.builtin.pause:
        seconds: 60
      when: layer_install is changed

    - name: Wait for host to come back
      ansible.builtin.raw: echo up
      register: host_up
      until: host_up is success
      retries: 30
      delay: 20
      changed_when: false
      when: layer_install is changed

- name: Prepare Core
  hosts: core
  become: true
  tasks:
    - name: Check if podman-compose is installed
      ansible.builtin.command: rpm -q podman-compose
      register: podman_compose_check
      changed_when: false
      failed_when: false

    - name: Install podman-compose
      ansible.builtin.command: rpm-ostree install podman-compose
      when: podman_compose_check.rc != 0
      register: podman_compose_install

    - name: Check if sysbench is installed
      ansible.builtin.command: rpm -q sysbench
      register: sysbench_check
      changed_when: false
      failed_when: false

    - name: Install sysbench
      ansible.builtin.command: rpm-ostree install sysbench
      when: sysbench_check.rc != 0
      register: sysbench_install

    - name: Check if btop is installed
      ansible.builtin.command: rpm -q btop
      register: btop_check
      changed_when: false
      failed_when: false

    - name: Install btop
      ansible.builtin.command: rpm-ostree install btop
      when: btop_check.rc != 0
      register: btop_install

    - name: Reboot if needed
      ansible.builtin.reboot:
      when: podman_compose_install is changed or sysbench_install is changed or btop_install is changed

    - name: Allow rootless containers to bind ports 443 and up
      ansible.builtin.copy:
        dest: /etc/sysctl.d/90-unprivileged-ports.conf
        content: "net.ipv4.ip_unprivileged_port_start=443\n"
        mode: "0644"
      register: unprivileged_ports

    - name: Apply sysctl settings
      ansible.builtin.command: sysctl --system
      when: unprivileged_ports is changed
