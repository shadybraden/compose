---
- name: Deploy Pi-hole on openwrt
  hosts: router
  
  vars:
    compose_dir: /opt/config_storage/compose
  tasks:
    - name: Git pull latest changes
      ansible.builtin.shell:
        cmd: git pull
        chdir: "{{ compose_dir }}"

    - name: Pi-hole `docker compose up -d`
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}/openwrt/pihole"
        state: present
        pull: missing

    - name: dnscrypt-proxy `docker compose up -d`
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}/openwrt/dnscrypt"
        state: present
        pull: missing
