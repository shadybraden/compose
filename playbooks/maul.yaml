- name: Prepare maul
  hosts: maul
  vars:
    shared_repos:
      - name: icons
        repo: https://git.holmlab.org/shady/icons
        dest: ~/icons
    hugo_image: docker.io/hugomods/hugo:0.165.0
    hugo_base_url: https://maul.shadybraden.com/
    sites:
      - name: shadybradencom
        repo: https://git.holmlab.org/shady/shadybradencom
        pull_image: "{{ hugo_image }}"
        build: >-
          podman --storage-driver vfs run --rm
          -v $PWD:/src:z
          -w /src --entrypoint hugo {{ hugo_image }}
          --destination /src/public --cleanDestinationDir --minify --baseURL={{ hugo_base_url }}
        output: public
        dest: ~/config_storage/shadybradencom/public
      - name: jetlag_map
        repo: https://git.holmlab.org/shady/JetLagHideAndSeek
        npm: true
        build: BASE=/ npm run build
        output: dist
        dest: ~/config_storage/jetlag_map/dist
  tasks:
    - name: Create intranet network
      containers.podman.podman_network:
        name: intranet
        subnet: 10.89.0.0/24
        state: present

    - name: Enable podman.socket for the rootless API
      ansible.builtin.systemd:
        name: podman.socket
        enabled: true
        state: started
        scope: user

    - name: Enable podman-restart so containers start at boot
      ansible.builtin.systemd:
        name: podman-restart.service
        enabled: true
        state: started
        scope: user

    - name: Create intranet-backend network (no egress)
      containers.podman.podman_network:
        name: intranet-backend
        subnet: 10.90.0.0/24
        internal: true
        state: present

    - name: Refresh shared repos
      ansible.builtin.include_tasks: tasks/maul_repo.yaml
      loop: "{{ shared_repos }}"
      loop_control:
        loop_var: repo

    - name: Build and deploy sites
      ansible.builtin.include_tasks: tasks/maul_site.yaml
      loop: "{{ sites }}"
      loop_control:
        loop_var: site

- name: Show maul OS version
  hosts: maul
  gather_facts: false
  tasks:
    - name: Read VERSION from os-release
      ansible.builtin.command: grep '^VERSION=' /etc/os-release
      register: os_version
      changed_when: false

    - name: Print VERSION
      ansible.builtin.debug:
        msg: "{{ os_version.stdout }}"
