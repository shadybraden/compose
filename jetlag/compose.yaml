---
name: jetlag
services:
  nginx:
    image: nginx:1.31.8
    container_name: jetlag
    volumes:
      - /data/dont_backup/jetlag_map/dist:/usr/share/nginx/html:ro,z
    environment:
      - TZ=${TZ}
    ports:
      - '0.0.0.0:38080:80'
    networks:
      - intranet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    user: "101:101"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M
        reservations:
          memory: 16M
    dns:
      - 0.0.0.0
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - '/tmp:size=64m,mode=1777'
      - '/var/cache/nginx:size=64m,mode=1777'
      - '/var/run:size=8m,mode=1777'
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
      nproc: 64

networks:
  intranet:
    external: true
