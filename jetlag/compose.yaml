---
name: jetlag
services:
  nginx:
    image: docker.io/nginx:1.31.8
    container_name: jetlag
    volumes:
      - ${HOME}/config_storage/jetlag_map/dist:/usr/share/nginx/html:ro,z
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro,z  # listen on 8089, non-root cannot bind 80\
    environment:
      - TZ=${TZ}
      - NO_PROXY=localhost
      - no_proxy=localhost
    networks:
      - intranet-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jetlag-secure.entrypoints=https"
      - "traefik.http.routers.jetlag-secure.rule=Host(`jetlag.${DOMAIN}`)"
      - "traefik.http.routers.jetlag-secure.tls=true"
      - "traefik.http.routers.jetlag-secure.service=jetlag"
      - "traefik.http.services.jetlag.loadbalancer.server.port=8089"  # port of the service.
      - "traefik.docker.network=intranet-backend"
      - "homepage.group=Other"
      - "homepage.name=jetlag.shadybraden.com"
      - "homepage.icon=/images/jetlag.png"
      - "homepage.href=https://jetlag.${DOMAIN}/"
    user: "101:101"
    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M
        reservations:
          memory: 16M
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - '/tmp:size=64m,mode=1777'
      - '/var/cache/nginx:size=64m,mode=1777'
      - '/var/run:size=8m,mode=1777'
    ulimits:
      nofile:
        soft: 1024
        hard: 2048

networks:
  intranet-backend:
    external: true
