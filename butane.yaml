variant: fcos
version: 1.7.0
passwd:
  users:
    - name: admin
      shell: /bin/bash
      groups:
        - maul
      ssh_authorized_keys:
        - "from=\"10.1.1.0/24\" ssh-rsa  admin@holmmade.org"
      password_hash: "$y$j9T$ZlxpSw28xTChKvEZECVqA0$G/7CuOuAjcFsnUlZnAi3nlM6YtxY/HlqY1pLIpObvP4" # mkpasswd -m yescrypt

    - name: maul
      ssh_authorized_keys:
        - "from=\"10.1.1.0/24\" ssh-rsa  maul@holmmade.org"

storage:
  directories:
    - path: /data/config_storage
      mode: 0750
      user:
        name: maul
      group:
        name: maul
  files:
    - path: /etc/sudoers.d/admin
      mode: 0440
      contents:
        inline: |
          admin ALL=(ALL) ALL

    - path: /etc/ssh/sshd_config.d/10-hardening.conf
      mode: 0644
      contents:
        inline: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          PermitEmptyPasswords no

          AllowUsers admin maul

          X11Forwarding no
          AllowAgentForwarding no
          AllowTcpForwarding no
          MaxAuthTries 3
          LoginGraceTime 30
          ClientAliveInterval 300
          ClientAliveCountMax 2

    - path: /etc/selinux/config
      mode: 0644
      overwrite: true
      contents:
        inline: |
          SELINUX=enforcing
          SELINUXTYPE=targeted

    # Rootless podman linger
    - path: /var/lib/systemd/linger/maul
      mode: 0644
      contents:
        inline: ""

    - path: /etc/example-proxy.env
      mode: 0644
      contents:
        inline: |
          https_proxy="http://10.1.1.65:3128"
          all_proxy="http://10.1.1.65:3128"
          http_proxy="http://10.1.1.65:3128"
          HTTP_PROXY="http://10.1.1.65:3128"
          HTTPS_PROXY="http://10.1.1.65:3128"

    - path: /etc/hostname
      mode: 0644
      overwrite: true
      contents:
        inline: maul

    - path: /etc/zincati/config.d/51-rollout-wariness.toml
      contents:
        inline: |
          [identity]
          rollout_wariness = 0.001

    - path: /etc/zincati/config.d/55-updates-strategy.toml
      contents:
        inline: |
          [updates]
          strategy = "periodic"
          [[updates.periodic.window]]
          days = [ "Sat", "Sun", "Mon", "Tue", "Wed", "Thu", "Fri" ]
          start_time = "01:00"
          length_minutes = 360

    - path: /etc/firewalld/zones/public.xml
      mode: 0644
      overwrite: true
      contents:
        inline: |
          <?xml version="1.0" encoding="utf-8"?>
          <zone>
            <short>Public</short>
            <description>SSH from LAN only, HTTPS from anywhere.</description>
            <rule family="ipv4">
              <source address="10.1.1.0/24"/>
              <service name="ssh"/>
              <accept/>
            </rule>
            <service name="https"/>
          </zone>

    - path: /etc/firewalld/direct.xml
      mode: 0644
      overwrite: true
      contents:
        inline: |
          <?xml version="1.0" encoding="utf-8"?>
          <direct>
            <rule ipv="ipv4" table="filter" chain="OUTPUT" priority="0">-o lo -j ACCEPT</rule>
            <rule ipv="ipv4" table="filter" chain="OUTPUT" priority="1">-m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT</rule>
            <rule ipv="ipv4" table="filter" chain="OUTPUT" priority="2">-d 10.1.1.65/32 -p tcp --dport 3128 -j ACCEPT</rule>
            <rule ipv="ipv4" table="filter" chain="OUTPUT" priority="3">-p udp --dport 53 -j ACCEPT</rule>
            <rule ipv="ipv4" table="filter" chain="OUTPUT" priority="4">-p tcp --dport 53 -j ACCEPT</rule>
            <rule ipv="ipv4" table="filter" chain="OUTPUT" priority="5">-p udp --dport 67:68 -j ACCEPT</rule>
            <rule ipv="ipv4" table="filter" chain="OUTPUT" priority="6">-p udp --dport 123 -j ACCEPT</rule>
            <rule ipv="ipv4" table="filter" chain="OUTPUT" priority="99">-j DROP</rule>
            <rule ipv="ipv4" table="filter" chain="FORWARD" priority="0">-s 10.88.0.0/16 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT</rule>
            <rule ipv="ipv4" table="filter" chain="FORWARD" priority="1">-s 10.88.0.0/16 -d 10.1.1.65/32 -p tcp --dport 3128 -j ACCEPT</rule>
            <rule ipv="ipv4" table="filter" chain="FORWARD" priority="99">-s 10.88.0.0/16 -j DROP</rule>
          </direct>

    - path: /etc/systemd/system/zincati.service.d/proxy.conf
      mode: 0644
      contents:
        inline: |
          [Service]
          Environment="http_proxy=http://10.1.1.65:3128"
          Environment="https_proxy=http://10.1.1.65:3128"
          Environment="HTTP_PROXY=http://10.1.1.65:3128"
          Environment="HTTPS_PROXY=http://10.1.1.65:3128"

    - path: /etc/audit/rules.d/hardening.rules
      mode: 0640
      contents:
        inline: |
          -w /etc/ssh/sshd_config -p wa -k sshd
          -w /etc/ssh/sshd_config.d/ -p wa -k sshd
          -w /etc/sudoers.d/ -p wa -k sudoers
          -w /etc/passwd -p wa -k identity
          -w /etc/shadow -p wa -k identity
          -w /etc/selinux/ -p wa -k selinux
          -w /etc/firewalld/ -p wa -k firewall
          -w /etc/containers/ -p wa -k containers
          -w /etc/systemd/system/ -p wa -k systemd

    - path: /etc/systemd/system/rpm-ostreed.service.d/proxy.conf
      mode: 0644
      contents:
        inline: |
          [Service]
          Environment="http_proxy=http://10.1.1.65:3128"
          Environment="https_proxy=http://10.1.1.65:3128"
          Environment="HTTP_PROXY=http://10.1.1.65:3128"
          Environment="HTTPS_PROXY=http://10.1.1.65:3128"

  links:
    - path: /etc/localtime
      target: ../usr/share/zoneinfo/America/New_York

kernel_arguments:
  should_exist:
    - selinux=1
    - enforcing=1

systemd:
  units:
    - name: layer-hardening.service
      enabled: true
      contents: |
        [Unit]
        Description=Layer auditd and fapolicyd, then reboot once
        Wants=network-online.target
        After=network-online.target
        ConditionPathExists=!/var/lib/layer-hardening.done

        [Service]
        Type=oneshot
        ExecStart=/usr/bin/rpm-ostree install --idempotent audit fapolicyd
        ExecStart=/usr/bin/touch /var/lib/layer-hardening.done
        ExecStart=/usr/bin/systemctl --no-block reboot

        [Install]
        WantedBy=multi-user.target
    - name: enable-hardening.service
      enabled: true
      contents: |
        [Unit]
        Description=Enable fapolicyd and auditd after layering
        ConditionPathExists=/var/lib/layer-hardening.done
        ConditionPathExists=/usr/lib/systemd/system/fapolicyd.service

        [Service]
        Type=oneshot
        ExecStart=/usr/bin/systemctl enable --now fapolicyd.service auditd.service
        ExecStart=/usr/bin/touch /var/lib/enable-hardening.done
        RemainAfterExit=yes

        [Install]
        WantedBy=multi-user.target
