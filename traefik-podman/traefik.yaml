# the ACME email comes from CF_API_EMAIL in .env (TRAEFIK_CERTIFICATESRESOLVERS_CLOUDFLARE_ACME_EMAIL)
api:
  dashboard: true
  debug: false
entryPoints:
  https:
    address: ":443"
    forwardedHeaders:
      insecure: false
    # http:
    #  middlewares: # uncomment if using CrowdSec - see my video
    #    - crowdsec-bouncer@file
  # tcp:
   # address: ":10000"
  # apis:
   # address: ":33073"
#  websecure: # for immich. see immich's readme.md
#    address: :443
    # this section needs to be added
#    transport:
#      respondingTimeouts:
#        readTimeout: 600s
#        idleTimeout: 600s
#        writeTimeout: 600s
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  file:
    filename: /etc/traefik/config.yaml # example provided gives A+ rating https://www.ssllabs.com/ssltest/
certificatesResolvers:
  cloudflare:
    acme:
      # caServer: https://acme-v02.api.letsencrypt.org/directory # production (default)
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory # staging (testing)
      storage: acme.json
      dnsChallenge:
        provider: cloudflare # change as required
        # disablePropagationCheck: true # Some people using Cloudflare note this can solve DNS propagation issues.
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

global:
  checkNewVersion: false

log:
  level: "INFO"
  filePath: "/var/log/traefik/traefik.log"
accessLog:
  filePath: "/var/log/traefik/access.log"