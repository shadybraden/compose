---
name: hugo-server
services:
  nginx:
    image: nginx:1.31.8
    container_name: hugo-server
    volumes:
      - ${HOME}/config_storage/shadybradencom/public:/usr/share/nginx/html:ro,z
    environment:
      - TZ=America/New_York
    networks:
      - intranet-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hugo-secure.entrypoints=https"
      - "traefik.http.routers.hugo-secure.rule=Host(`hugo.${DOMAIN}`)"
      - "traefik.http.routers.hugo-secure.tls=true"
      - "traefik.http.routers.hugo-secure.service=hugo"
      - "traefik.http.services.hugo.loadbalancer.server.port=80"  # port of the service.
      - "traefik.docker.network=intranet-backend"
      - "homepage.group=Other"
      - "homepage.name=hugo"
      - "homepage.icon=/images/hugo.png"
      - "homepage.href=https://hugo.${DOMAIN}/"
    user: "101:101"
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M
        reservations:
          memory: 16M
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - '/tmp:size=64m,uid=101,gid=101,mode=1777'
      - '/var/cache/nginx:size=64m,uid=101,gid=101,mode=0755'
      - '/var/run:size=8m,uid=101,gid=101,mode=0755'
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
      nproc: 64

networks:
  intranet-backend:
    external: true
