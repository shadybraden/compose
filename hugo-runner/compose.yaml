---
name: hugo-server
services:
  nginx:
    image: docker.io/nginx:1.31.8
    container_name: hugo-server
    volumes:
      - ${HOME}/config_storage/shadybradencom/public:/usr/share/nginx/html:ro,z
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro,z  # listen on 8088, non-root cannot bind 80
    environment:
      - TZ=America/New_York
    networks:
      - intranet-backend
    ports:
      - 34788:8088
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hugo-secure.entrypoints=https"
      - "traefik.http.routers.hugo-secure.rule=Host(`hugo.${DOMAIN}`)"
      - "traefik.http.routers.hugo-secure.tls=true"
      - "traefik.http.routers.hugo-secure.service=hugo"
      - "traefik.http.services.hugo.loadbalancer.server.port=8088"  # port of the service.
      - "traefik.docker.network=intranet-backend"
      - "homepage.group=Other"
      - "homepage.name=hugo"
      - "homepage.icon=/images/hugo.png"
      - "homepage.href=https://hugo.${DOMAIN}/"

networks:
  intranet-backend:
    external: true
