name: Build skywatch image

on:
  push:
    paths:
      - 'skywatch/Dockerfile'
      - 'skywatch/skywatch.py'
      - 'skywatch/watchlist.txt'
      - 'skywatch/ignorelist.txt'
      - 'skywatch/skywatch.py'
      - '.forgejo/workflows/build_skywatch.yaml'
  workflow_dispatch:
    inputs:
      version:
        description: 'version to publish'
        required: true
        type: string
        default: '0.0.1'

jobs:
  Build-Dockerfile:
    runs-on: tools_container

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Determine version
        id: version
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"

          if [ -n "$INPUT_VERSION" ]; then
            echo "Using manually specified version: $INPUT_VERSION"
            echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "Fetching latest tag from registry..."

            # Fetch tags from Forgejo container registry API
            TAGS=$(curl -s \
              "https://git.holmlab.org/api/v1/packages/shady?type=container&limit=50" \
              | jq -r '.[] | select(.name == "skywatch/Dockerfile") | .version')

            if [ -z "$TAGS" ]; then
              echo "No existing tags found, starting at 0.0.1"
              NEW_VERSION="0.0.1"
            else
              # Sort tags as semver, pick the highest
              LATEST=$(echo "$TAGS" \
                | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -t. -k1,1n -k2,2n -k3,3n \
                | tail -n1)

              echo "Latest version found: $LATEST"

              # Bump patch
              MAJOR=$(echo "$LATEST" | cut -d. -f1)
              MINOR=$(echo "$LATEST" | cut -d. -f2)
              PATCH=$(echo "$LATEST" | cut -d. -f3)
              NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            fi

            echo "New version: $NEW_VERSION"
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          fi


      - name: Set up QEMU binfmt for multi-arch
        run: |
          podman --storage-driver vfs run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build multi-arch image
        run: |
          podman --storage-driver vfs build \
            --platform linux/amd64,linux/arm64 \
            -f skywatch/Dockerfile \
            -t skywatch:${{ steps.version.outputs.version }} .

      - name: Push multi-arch image
        run: |
          buildah --storage-driver vfs push \
            --all \
            --creds "${{ secrets.REGISTRY_USERNAME }}:${{ secrets.REGISTRY_PASSWORD }}" \
            skywatch:${{ steps.version.outputs.version }} \
            docker://git.holmlab.org/shady/skywatch:${{ steps.version.outputs.version }}

      - name: Notify failure
        if: failure()
        run: |
          curl -X POST https://ntfy.holmlab.org/${{ secrets.NTFY_TOPIC }} \
            -H "Title: ‼️ Actions failed" \
            -H "Priority: low" \
            -d "Workflow '${{ github.workflow }}' failed"
