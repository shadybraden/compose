name: Lint

on:
  pull_request:
  workflow_dispatch:

jobs:
  Lint:
    runs-on: tools_container
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Get changed compose files
        id: changed
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            FILES=$(git diff --name-only \
              "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
              -- '**/compose.y*ml' \
              | tr '\n' ' ' | sed 's/ *$//')
          else
            FILES="."
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Lint changed compose files
        if: steps.changed.outputs.files != ''
        uses: https://github.com/docker-compose-linter/dclint-github-action@v1.6.0
        with:
          path: ${{ steps.changed.outputs.files }}
