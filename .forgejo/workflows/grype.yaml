name: Grype scan

on:
  pull_request:
  workflow_dispatch:

jobs:
  Grype:
    runs-on: tools_container
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Get changed compose files
        id: changed
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            FILES=$(git diff --name-only \
              "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
              -- '**/compose.y*ml' \
              | tr '\n' ' ' | sed 's/ *$//')
          else
            FILES=$(find . -name 'compose.yaml' -o -name 'compose.yml' \
              | tr '\n' ' ' | sed 's/ *$//')
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Scan changed compose images
        if: steps.changed.outputs.files != ''
        run: |
          set -eu

          IMAGES=$(mktemp)
          REPORT=$(mktemp)
          trap 'rm -f "$IMAGES" "$REPORT"' EXIT

          for file in ${{ steps.changed.outputs.files }}; do
            awk '
              /^[[:space:]]*image:[[:space:]]*/ {
                sub(/^[[:space:]]*image:[[:space:]]*/, "")
                sub(/[[:space:]]+#.*$/, "")
                sub(/[[:space:]]+$/, "")
                print
              }
            ' "$file" | tr -d "\"'"
          done | sort -u > "$IMAGES"

          FAILED=0
          KEV_COUNT=0
          CRITICAL_COUNT=0
          HIGH_COUNT=0
          while IFS= read -r image; do
            [ -n "$image" ] || continue
            echo "Scanning $image"
            grype "registry:$image" --by-cve --only-fixed -o json > "$REPORT"

            set -- $(jq -r '
              [
                ([.matches[] | select(((.vulnerability.knownExploited // []) | length > 0))] | length),
                ([.matches[] | select(.vulnerability.severity == "Critical")] | length),
                ([.matches[] | select(.vulnerability.severity == "High")] | length)
              ]
              | @tsv
            ' "$REPORT")
            KEV_COUNT=$((KEV_COUNT + $1))
            CRITICAL_COUNT=$((CRITICAL_COUNT + $2))
            HIGH_COUNT=$((HIGH_COUNT + $3))

            jq -r '
              .matches[]
              | select(
                  .vulnerability.severity == "Critical"
                  or .vulnerability.severity == "High"
                  or ((.vulnerability.knownExploited // []) | length > 0)
                )
              | [
                  .vulnerability.id,
                  .vulnerability.severity,
                  (if ((.vulnerability.knownExploited // []) | length > 0) then "KEV" else "" end),
                  .artifact.name,
                  .artifact.version
                ]
              | @tsv
            ' "$REPORT"

            if jq -e '
              any(.matches[];
                .vulnerability.severity == "Critical"
                or .vulnerability.severity == "High"
                or ((.vulnerability.knownExploited // []) | length > 0)
              )
            ' "$REPORT" > /dev/null; then
              echo "Blocking vulnerabilities found in $image"
              FAILED=1
            fi
          done < "$IMAGES"

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "Grype scan failed"
            echo "KEV findings:      $KEV_COUNT"
            echo "Critical findings: $CRITICAL_COUNT"
            echo "High findings:     $HIGH_COUNT"
          fi

          exit "$FAILED"
