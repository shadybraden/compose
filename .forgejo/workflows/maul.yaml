name: Configure Core and Deploy services on Maul

concurrency:
  group: maul-deploy
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service directory to deploy to Maul (none skips the Maul-Services job)'
        required: true
        type: choice
        default: none
        options:
          - none
          - chhoto-url
          - traefik-podman
          - homepage-podman
          - dozzle-podman
          - shadybradencom
          - tinyauth-podman
  push:
    branches: [main]

jobs:
  Core:
    runs-on: tools_container
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CORE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Run Ansible "core"
        run: |
          ansible-playbook playbooks/core.yaml
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Notify failure
        if: failure()
        run: |
          curl -X POST https://ntfy.holmlab.org/${{ secrets.NTFY_TOPIC }} \
            -H "Title: ‼️ Actions failed" \
            -H "Priority: low" \
            -d "Workflow '${{ github.workflow }}' failed"

  Maul:
    needs: Core
    runs-on: tools_container
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MAUL_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r requirements.yml

      - name: Run Ansible "maul"
        run: |
          ansible-playbook playbooks/maul.yaml
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Notify failure
        if: failure()
        run: |
          curl -X POST https://ntfy.holmlab.org/${{ secrets.NTFY_TOPIC }} \
            -H "Title: ‼️ Actions failed" \
            -H "Priority: low" \
            -d "Workflow '${{ github.workflow }}' failed"

  Detect:
    needs: Maul
    runs-on: tools_container
    outputs:
      services: ${{ steps.services.outputs.services }}
    env:
      # Service directories that deploy to maul. Add a name here to enable it.
      MAUL_SERVICES: "chhoto-url traefik-podman tinyauth-podman homepage-podman dozzle-podman shadybradencom"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Find services to deploy
        id: services
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANGED="${{ github.event.inputs.service }}"
            [ "$CHANGED" = "none" ] && CHANGED=""
          else
            CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- '*/compose.yaml' | cut -d/ -f1)
          fi
          SELECTED=""
          for s in $CHANGED; do
            case " $MAUL_SERVICES " in
              *" $s "*) SELECTED="$SELECTED $s" ;;
            esac
          done
          SELECTED=$(echo $SELECTED | xargs)
          echo "Services to deploy: ${SELECTED:-none}"
          echo "services=$SELECTED" >> "$GITHUB_OUTPUT"

  Maul-Services:
    needs: [Detect]
    if: needs.Detect.outputs.services != ''
    runs-on: tools_container
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MAUL_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r requirements.yml

      - name: Deploy services to Maul via Ansible
        run: |
          for s in ${{ needs.Detect.outputs.services }}; do
            ansible-playbook playbooks/maul_service.yaml -e service="$s"
          done
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_FORCE_COLOR: "1"
          INFISICAL_MAUL_CLIENTID: ${{ secrets.INFISICAL_MAUL_CLIENTID }}
          INFISICAL_MAUL_PROJECT_ID: ${{ secrets.INFISICAL_MAUL_PROJECT_ID }}
          INFISICAL_MAUL_CLIENTSECRET: ${{ secrets.INFISICAL_MAUL_CLIENTSECRET }}
          INFISICAL_ENVIRONMENT: "prod"
          INFISICAL_DOMAIN: "https://infisical.holmlab.org/"

      - name: Notify failure
        if: failure()
        run: |
          curl -X POST https://ntfy.holmlab.org/${{ secrets.NTFY_TOPIC }} \
            -H "Title: ‼️ Actions failed" \
            -H "Priority: low" \
            -d "Workflow '${{ github.workflow }}' failed"
