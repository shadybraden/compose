---
name: kener
services:
  kener:
    image: rajnandan1/kener:v4.1.5
    container_name: kener
    depends_on:
      - kener_postgres
      - kener_redis
    environment:
      KENER_SECRET_KEY: ${KENER_SECRET_KEY}
      ORIGIN: "https://kener.${DOMAIN}"
      DATABASE_URL: "postgresql://kener:${POSTGRES_PASSWORD}@kener_postgres:5432/kener"
      REDIS_URL: "redis://kener_redis:6379"
    networks:
      - intranet
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kener.entrypoints=http"
      - "traefik.http.routers.kener.rule=Host(`kener.${DOMAIN}`)"
      - "traefik.http.middlewares.kener-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.kener.middlewares=kener-https-redirect"
      - "traefik.http.routers.kener-secure.entrypoints=https"
      - "traefik.http.routers.kener-secure.rule=Host(`kener.${DOMAIN}`)"
      - "traefik.http.routers.kener-secure.tls=true"
      - "traefik.http.routers.kener-secure.service=kener"
      - "traefik.http.services.kener.loadbalancer.server.port=3000"  # port of the service
      - "traefik.docker.network=intranet"
      - "homepage.group=Infrastructure"
      - "homepage.name=Kener"
      - "homepage.icon=/images/kener.png"
      - "homepage.href=https://kener.${DOMAIN}/"
      - env=production
    dns:
      - ${DNS_SERVER1}
      - ${DNS_SERVER2}
    security_opt:
      - no-new-privileges:true  # helps to increase security

  kener_postgres:
    image: postgres:18.6
    container_name: kener_postgres
    volumes:
      - /data/config_storage/kener/postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: kener
      POSTGRES_USER: kener
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - intranet
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true  # helps to increase security

  kener_redis:
    image: redis:7.4.11-alpine
    container_name: kener_redis
    volumes:
      - /data/config_storage/kener/redis_data:/data
    networks:
      - intranet
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true  # helps to increase security

networks:
  intranet:
    external: true