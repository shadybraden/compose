---
services:
  hermes-agent:
    command: 'gateway run'
    image: nousresearch/hermes-agent:v2026.7.30
    volumes:
      - /data/config_storage/hermes:/opt/data
    restart: unless-stopped
    container_name: hermes
    dns:
      - ${DNS_SERVER1}
      - ${DNS_SERVER2}
    security_opt:
      - no-new-privileges:true  # helps to increase security
    networks:
      - intranet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hermes.entrypoints=http"
      - "traefik.http.routers.hermes.rule=Host(`hermes.${DOMAIN}`)"
      - "traefik.http.middlewares.hermes-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.hermes.middlewares=hermes-https-redirect"
      - "traefik.http.routers.hermes-secure.entrypoints=https"
      - "traefik.http.routers.hermes-secure.rule=Host(`hermes.${DOMAIN}`)"
      - "traefik.http.routers.hermes-secure.tls=true"
      - "traefik.http.routers.hermes-secure.service=hermes"
      - "traefik.http.services.hermes.loadbalancer.server.port=8642"  # port of the service.
      - "traefik.docker.network=intranet"
      - "homepage.group=Other"
      - "homepage.name=hermes"
      - "homepage.icon=/images/hermes.png"
      - "homepage.href=https://hermes.${DOMAIN}/"

networks:
  intranet:
    external: true
