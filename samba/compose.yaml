services:
  samba:
    image: ghcr.io/dockur/samba:4.23.10
    container_name: samba
    #user: 1000:1000
    environment:
      NAME: "NetworkShare"
      USER: "samba"
      PASS: "${PASS}"
    ports:
      - 445:445
    volumes:
      - /data/mnt/shows:/storage/shows:ro
      - /data/mnt/movies:/storage/movies:ro
      - /data/mnt/youtube:/storage/youtube
      - /data/dont_backup/samba/storage:/storage
      - /data/dont_backup/samba/config:/etc/samba
    restart: no
