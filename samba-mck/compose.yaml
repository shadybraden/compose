services:
  samba:
    image: ghcr.io/dockur/samba:4.23.10
    container_name: samba
    environment:
      NAME: "NetworkShare"
      USER: "samba"
      PASS: "${SAMBA_PASS}"
    ports:
      - 445:445
    volumes:
      - /data/mnt/shows/Kids:/storage/Kids:ro
      - /data/mnt/shows/Preschool:/storage/PreK:ro
      - /data/dont_backup/samba/config:/etc/samba
    restart: no
