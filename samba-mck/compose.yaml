services:
  samba:
    image: ghcr.io/dockur/samba:4.23.10
    container_name: samba
    environment:
      NAME: "NetworkShare"
      USER: "samba"
      PASS: "${SAMBA_PASS}"
    ports:
      - 445:445
    volumes:
      - /data/mnt/shows/Kids:/storage/Kids:ro
      - /data/mnt/shows/Preschool:/storage/PreK:ro
      - /home/mck/config_storage/compose/samba-mck/smb.conf:/etc/samba/smb.conf:ro
    restart: no
