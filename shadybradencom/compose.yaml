---
name: shadybradencom
services:
  shadybradencom:
    image: docker.io/nginx:1.31.8
    container_name: shadybradencom
    volumes:
      - ${HOME}/config_storage/shadybradencom/public:/usr/share/nginx/html:ro,z
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro,z  # listen on 8088, non-root cannot bind 80
    environment:
      - TZ=America/New_York
      - NO_PROXY=localhost
      - no_proxy=localhost
    networks:
      - intranet-backend
    restart: unless-stopped
    ports:
      - 34788:8088
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shadybradencom-secure.entrypoints=https"
      - "traefik.http.routers.shadybradencom-secure.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.shadybradencom-secure.tls=true"
      - "traefik.http.routers.shadybradencom-secure.service=shadybradencom"
      - "traefik.http.services.shadybradencom.loadbalancer.server.port=8088"  # port of the service.
      - "traefik.docker.network=intranet-backend"
      - "homepage.group=Other"
      - "homepage.name=shadybradencom"
      - "homepage.icon=/images/llama_clippy_130D07.png"
      - "homepage.href=https://${DOMAIN}/"
    user: "101:101"
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M
        reservations:
          memory: 16M
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - '/tmp:size=64m,mode=1777'
      - '/var/cache/nginx:size=64m,mode=1777'
      - '/var/run:size=8m,mode=1777'
    ulimits:
      nofile:
        soft: 1024
        hard: 2048

networks:
  intranet-backend:
    external: true
