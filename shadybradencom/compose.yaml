---
name: shadybradencom
services:
  nginx:
    image: docker.io/nginx:1.31.8
    container_name: shadybradencom
    volumes:
      - ${HOME}/config_storage/shadybradencom/public:/usr/share/nginx/html:ro,z
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro,z  # listen on 8088, non-root cannot bind 80
    environment:
      - TZ=America/New_York
    networks:
      - intranet-backend
    ports:
      - 34788:8088
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shadybradencom-secure.entrypoints=https"
      - "traefik.http.routers.shadybradencom-secure.rule=Host(`shadybradencom.${DOMAIN}`)"
      - "traefik.http.routers.shadybradencom-secure.tls=true"
      - "traefik.http.routers.shadybradencom-secure.service=shadybradencom"
      - "traefik.http.services.shadybradencom.loadbalancer.server.port=8088"  # port of the service.
      - "traefik.docker.network=intranet-backend"
      - "homepage.group=Other"
      - "homepage.name=shadybradencom"
      - "homepage.icon=/images/shadybradencom.png"
      - "homepage.href=https://shadybradencom.${DOMAIN}/"

networks:
  intranet-backend:
    external: true
