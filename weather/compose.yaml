---
name: weather
services:
  weather:
    image: git.holmlab.org/shady/weather:0.1.27
    container_name: weather
    volumes:
      - /data/config_storage/weather.xml:/data/weather.xml:ro
      - /data/config_storage/Discussion.html:/data/Discussion.html:ro
      - /data/config_storage/openmeteo_gfs.json:/data/openmeteo_gfs.json:ro
      - /data/config_storage/openmeteo_ecmwf.json:/data/openmeteo_ecmwf.json:ro
    environment:
      - TZ=America/New_York
      - PORT=9986
      - WEATHER_FILE=/data/weather.xml
      - DISCUSSION_FILE=/data/Discussion.html
      - OPEN_METEO_DIR=/data
      - HOME_ASSISTANT_URL=${HOME_ASSISTANT_URL:-}
      - HOME_ASSISTANT_TOKEN=${HOME_ASSISTANT_TOKEN:-}
      - HOME_ASSISTANT_TEMP_ENTITY=${HOME_ASSISTANT_TEMP_ENTITY:-}
    ports:
      - '0.0.0.0:9986:9986'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "__import__('urllib.request').request.urlopen('http://127.0.0.1:9986/api/weather',timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      options:
        max-size: 10m
    cap_drop:
      - ALL
    mem_limit: 256m
    dns:
      - 10.1.1.1
    expose:
      - '9986'
    pids_limit: 64
    read_only: true
    security_opt:
      - no-new-privileges:true  # helps to increase security
    tmpfs:
      - '/tmp:size=64m'
