---
name: speedtest
services:
  speedtest:
    image: ghcr.io/librespeed/speedtest:6.2.1
    container_name: speedtest
    environment:
      MODE: standalone
      TELEMETRY: "false"
      DISTANCE: "mi"
      WEBPORT: 8068
    ports:
      - 8068:8068
    networks:
      - intranet
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.speedtest.entrypoints=http"
      - "traefik.http.routers.speedtest.rule=Host(`speedtest.${DOMAIN}`)"
      - "traefik.http.middlewares.speedtest-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.speedtest.middlewares=speedtest-https-redirect"
      - "traefik.http.routers.speedtest-secure.entrypoints=https"
      - "traefik.http.routers.speedtest-secure.rule=Host(`speedtest.${DOMAIN}`)"
      - "traefik.http.routers.speedtest-secure.tls=true"
      - "traefik.http.routers.speedtest-secure.service=speedtest"
      - "traefik.http.services.speedtest.loadbalancer.server.port=8068"  # port of the service.
      - "traefik.docker.network=intranet"
      - "homepage.group=Other"
      - "homepage.name=speedtest"
      - "homepage.icon=/images/librespeed.png"
      - "homepage.href=https://speedtest.${DOMAIN}/index-modern.html?design=new"
      - "traefik.http.routers.speedtest.middlewares=anubis@docker"
    security_opt:
      - no-new-privileges:true  # helps to increase security

networks:
  intranet:
    external: true
