---
name: cloudflared
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    container_name: cloudflared
    networks:
      - intranet
    command: tunnel --no-autoupdate run --token ${token}
    restart: unless-stopped
    labels:
      - env=production

networks:
  intranet:
    external: true
