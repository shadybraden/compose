---
name: qbittorrent
services:
  qbittorrent:
    image: quay.io/linuxserver.io/qbittorrent:5.2.4
    container_name: qbittorrent
    volumes:
      - /data/config_storage/arr/qbittorrent:/config
      - /data/config_storage/arr/qbittorrent/complete:/complete
      - /data/mnt/torrents:/downloads/torrents
      - /data/mnt:/allMedia
      - /data/mnt/movies:/movies
      - /data/mnt/shows:/shows
      - /data/mnt/youtube:/youtube
      - /data/music:/music
      - /data/mnt/torrents:/torrents
      - /mnt/extra:/mnt
      - /data/dont_backup/media:/ssd
      - /data/audiobooks:/audiobooks
      - /data/ebooks:/ebooks
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - TORRENTING_PORT=${TORRENTING_PORT}
      - WEBUI_PORT=8080
    network_mode: container:gluetun
    restart: unless-stopped
    labels:
      - "homepage.group=Media"
      - "homepage.name=qbittorrent"
      - "homepage.icon=/images/qbittorrent.png"
      - "homepage.href=https://qbittorrent.${DOMAIN}/"
    security_opt:
      - no-new-privileges:true  # helps to increase security
