---
name: immich-podman
services:
  database-podman:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_postgres-podman
    volumes:
      - ${HOME}/config_storage/immich-podman/postgres:/var/lib/postgresql/data
    environment:
      - TZ=America/New_York
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=immich
      - POSTGRES_INITDB_ARGS='--data-checksums'
      - DB_HOSTNAME=database-podman
      - REDIS_HOSTNAME=redis-podman
      - DB_USERNAME=postgres
      - DB_DATABASE_NAME=immich
    networks:
      - intranet-backend
    restart: "no"
    labels:
      - env=production

  immich-machine-learning-podman:
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.6
    container_name: immich_machine_learning-podman
    volumes:
      - model-cache-podman:/cache
    environment:
      - TZ=America/New_York
      - DB_HOSTNAME=database-podman
      - REDIS_HOSTNAME=redis-podman
      - DB_USERNAME=postgres
      - DB_DATABASE_NAME=immich
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
    depends_on:
      - database-podman
      - redis-podman
    networks:
      - intranet-backend
    restart: "no"
    healthcheck:
      disable: true
    labels:
      - env=production

  immich-server-podman:
    image: ghcr.io/immich-app/immich-server:v3.3.6
    container_name: immich_server-podman
    depends_on:
      - database-podman
      - redis-podman
    volumes:
      - ${HOME}/config_storage/immich-podman/upload:/usr/src/app/upload
    environment:
      - TZ=America/New_York
      - IMMICH_TRUSTED_PROXIES=172.0.0.0/8
      - DB_HOSTNAME=database-podman
      - REDIS_HOSTNAME=redis-podman
      - DB_USERNAME=postgres
      - DB_DATABASE_NAME=immich
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
    ports:
      - '0.0.0.0:48408:2283'
    networks:
      - intranet-backend
    restart: "no"
    healthcheck:
      disable: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich-podman.entrypoints=http"
      - "traefik.http.routers.immich-podman.rule=Host(`immich-podman.${DOMAIN}`)"
      - "traefik.http.middlewares.immich-podman-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.immich-podman.middlewares=immich-podman-https-redirect"
      - "traefik.http.routers.immich-podman-secure.entrypoints=https"
      - "traefik.http.routers.immich-podman-secure.rule=Host(`immich-podman.${DOMAIN}`)"
      - "traefik.http.routers.immich-podman-secure.tls=true"
      - "traefik.http.routers.immich-podman-secure.service=immich-podman"
      - "traefik.http.services.immich-podman.loadbalancer.server.port=2283"  # port of the service
      - "traefik.docker.network=intranet-backend"
      - "homepage.group=Other"
      - "homepage.name=immich-podman"
      - "homepage.icon=/images/immich.png"
      - "homepage.href=https://immich-podman.${DOMAIN}/"
      - env=production
    security_opt:
      - no-new-privileges:true  # helps to increase security

  redis-podman:
    image: docker.io/valkey/valkey:9.1.2  # check: https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
    container_name: immich_redis-podman
    environment:
      - TZ=America/New_York
      - DB_HOSTNAME=database-podman
      - REDIS_HOSTNAME=redis-podman
      - DB_USERNAME=postgres
      - DB_DATABASE_NAME=immich
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
    networks:
      - intranet-backend
    restart: "no"
    healthcheck:
      test: redis-cli ping || exit 1
    labels:
      - env=production

networks:
  intranet-backend:
    external: true

volumes:
  model-cache-podman:
