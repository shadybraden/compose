---
name: immich-public
services:
  database-public:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_postgres-public
    volumes:
      - ${HOME}/config_storage/immich-public/postgres:/var/lib/postgresql/data
    environment:
      - TZ=America/New_York
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=immich
      - POSTGRES_INITDB_ARGS='--data-checksums'
      - DB_HOSTNAME=database-public
      - REDIS_HOSTNAME=redis-public
      - DB_USERNAME=postgres
      - DB_DATABASE_NAME=immich
    networks:
      - intranet-backend
    restart: no
    labels:
      - env=production

  immich-machine-learning-public:
    image: ghcr.io/immich-app/immich-machine-learning:v3.2.4
    container_name: immich_machine_learning-public
    volumes:
      - model-cache-public:/cache
    environment:
      - TZ=America/New_York
      - DB_HOSTNAME=database-public
      - REDIS_HOSTNAME=redis-public
      - DB_USERNAME=postgres
      - DB_DATABASE_NAME=immich
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
    networks:
      - intranet-backend
    restart: no
    healthcheck:
      disable: true
    labels:
      - env=production

  immich-server-public:
    image: ghcr.io/immich-app/immich-server:v3.2.4
    container_name: immich_server-public
    depends_on:
      - database-public
      - redis-public
    volumes:
      - ${HOME}/config_storage/immich-public/upload:/usr/src/app/upload
    environment:
      - TZ=America/New_York
      - IMMICH_TRUSTED_PROXIES=172.0.0.0/8
      - DB_HOSTNAME=database-public
      - REDIS_HOSTNAME=redis-public
      - DB_USERNAME=postgres
      - DB_DATABASE_NAME=immich
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
    ports:
      - '0.0.0.0:48408:2283'
    networks:
      - intranet-backend
    restart: no
    healthcheck:
      disable: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich-public.entrypoints=http"
      - "traefik.http.routers.immich-public.rule=Host(`immich-public.${DOMAIN}`)"
      - "traefik.http.middlewares.immich-public-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.immich-public.middlewares=immich-public-https-redirect"
      - "traefik.http.routers.immich-public-secure.entrypoints=https"
      - "traefik.http.routers.immich-public-secure.rule=Host(`immich-public.${DOMAIN}`)"
      - "traefik.http.routers.immich-public-secure.tls=true"
      - "traefik.http.routers.immich-public-secure.service=immich-public"
      - "traefik.http.services.immich-public.loadbalancer.server.port=2283"  # port of the service
      - "traefik.docker.network=intranet"
      - "homepage.group=Other"
      - "homepage.name=immich-public"
      - "homepage.icon=/images/immich.png"
      - "homepage.href=https://immich-public.${DOMAIN}/"
      - env=production
    security_opt:
      - no-new-privileges:true  # helps to increase security

  redis-public:
    image: docker.io/valkey/valkey:9.1.2  # check: https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
    container_name: immich_redis-public
    environment:
      - TZ=America/New_York
      - DB_HOSTNAME=database-public
      - REDIS_HOSTNAME=redis-public
      - DB_USERNAME=postgres
      - DB_DATABASE_NAME=immich
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
    networks:
      - intranet-backend
    restart: no
    healthcheck:
      test: redis-cli ping || exit 1
    labels:
      - env=production

networks:
  intranet-backend:
    external: true

volumes:
  model-cache-public:
