---
services:
  heyform:
    image: heyform/community-edition:v3.0.0
    container_name: heyform
    restart: unless-stopped
    ports:
      - 9513:8000
    volumes:
      - /data/config_storage/heyform/assets:/app/static/upload
    environment:
      APP_HOMEPAGE_URL: https://heyform.${DOMAIN}
      SESSION_KEY: ${SESSION_KEY}
      FORM_ENCRYPTION_KEY: ${FORM_ENCRYPTION_KEY}
      MONGO_URI: "mongodb://heyform_mongo:27017/heyform"
      REDIS_HOST: heyform_keydb
      REDIS_PORT: 6379
    depends_on:
      - heyform_mongo
      - heyform_keydb
    security_opt:
      - no-new-privileges:true  # helps to increase security
    networks:
      - intranet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.heyform.entrypoints=http"
      - "traefik.http.routers.heyform.rule=Host(`heyform.${DOMAIN}`)"
      - "traefik.http.middlewares.heyform-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.heyform.middlewares=heyform-https-redirect"
      - "traefik.http.routers.heyform-secure.entrypoints=https"
      - "traefik.http.routers.heyform-secure.rule=Host(`heyform.${DOMAIN}`)"
      - "traefik.http.routers.heyform-secure.tls=true"
      - "traefik.http.routers.heyform-secure.service=heyform"
      - "traefik.http.services.heyform.loadbalancer.server.port=8000"  # port of the service.
      - "traefik.docker.network=intranet"
      - "homepage.group=Other"
      - "homepage.name=heyform"
      - "homepage.icon=/images/heyform.png"
      - "homepage.href=https://heyform.${DOMAIN}/"

  heyform_mongo:
    image: percona/percona-server-mongodb:8.3
    container_name: heyform_mongo
    restart: unless-stopped
    volumes:
      - /data/config_storage/heyform/mongodb_data:/data/db
    security_opt:
      - no-new-privileges:true  # helps to increase security
    networks:
      - intranet

  heyform_keydb:
    image: eqalpha/keydb:6.3.3
    container_name: heyform_keydb
    command: keydb-server --appendonly yes --protected-mode no
    restart: unless-stopped
    volumes:
      - /data/config_storage/heyform/keydb_data:/data  # persist cache data
    security_opt:
      - no-new-privileges:true  # helps to increase security
    networks:
      - intranet

networks:
  intranet:
    external: true
