---
name: odoo
services:
  odoo:
    image: odoo:19.0
    container_name: odoo
    depends_on:
      - odoo_postgres
    volumes:
      - /data/config_storage/odoo:/var/lib/odoo
    environment:
      - HOST=odoo_postgres
      - USER=odoo
      - PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - intranet
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.odoo.entrypoints=http"
      - "traefik.http.routers.odoo.rule=Host(`odoo.${DOMAIN}`)"
      - "traefik.http.middlewares.odoo-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.odoo.middlewares=odoo-https-redirect"
      - "traefik.http.routers.odoo-secure.entrypoints=https"
      - "traefik.http.routers.odoo-secure.rule=Host(`odoo.${DOMAIN}`)"
      - "traefik.http.routers.odoo-secure.tls=true"
      - "traefik.http.routers.odoo-secure.service=odoo"
      - "traefik.http.services.odoo.loadbalancer.server.port=8069"  # port of the service.
      - "traefik.docker.network=intranet"
      - "homepage.group=Other"
      - "homepage.name=odoo"
      - "homepage.icon=/images/odoo.png"
      - "homepage.href=https://odoo.${DOMAIN}/"
    security_opt:
      - no-new-privileges:true  # helps to increase security

  odoo_postgres:
    image: postgres:15.19
    container_name: odoo_postgres
    volumes:
      - /data/config_storage/odoo/postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - intranet
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true  # helps to increase security

networks:
  intranet:
    external: true
