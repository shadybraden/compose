---
name: ghost
services:
  db:
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    volumes:
      - /data/config_storage/ghost/mysql:/var/lib/mysql
      - /data/config_storage/ghost/mysql-init:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ghost
      MYSQL_MULTIPLE_DATABASES: activitypub
      TZ: America/New_York
    networks:
      - ghost_network
      - intranet
    restart: no
    healthcheck:
      test: mysqladmin ping -p$$MYSQL_ROOT_PASSWORD -h 127.0.0.1
      interval: 1s
      start_period: 30s
      start_interval: 10s
      retries: 120
    dns:
      - ${DNS_SERVER1}
      - ${DNS_SERVER2}
    expose:
      - '0.0.0.0:3306'
    security_opt:
      - no-new-privileges:true  # helps to increase security

  ghost:
    # Do not alter this without updating the Tinybird Sync container as well
    image: ghost:6.60.0-alpine3.23
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /data/config_storage/ghost/content:/var/lib/ghost/content
    environment:
      NODE_ENV: production
      url: https://ghost.${DOMAIN}
      database__client: mysql
      database__connection__host: db
      database__connection__user: ghost
      database__connection__password: ${DATABASE_PASSWORD}
      database__connection__database: ghost
      GHOST_PORT: 2368
      mail__transport: SMTP
      mail__options__host: ${mail__options__host}
      mail__options__port: 465
      mail__options__secure: true
      mail__options__auth__user: ${mail__options__auth__user}
      mail__options__auth__pass: ${mail__options__auth__pass}
      mail__from: "'Support' <${mail__options__auth__user}>"
      TZ: America/New_York
    networks:
      - ghost_network
      - intranet
    restart: no
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ghost.entrypoints=http"
      - "traefik.http.routers.ghost.rule=Host(`ghost.${DOMAIN}`)"
      - "traefik.http.middlewares.ghost-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.ghost.middlewares=ghost-https-redirect"
      - "traefik.http.routers.ghost-secure.entrypoints=https"
      - "traefik.http.routers.ghost-secure.rule=Host(`ghost.${DOMAIN}`)"
      - "traefik.http.routers.ghost-secure.tls=true"
      - "traefik.http.routers.ghost-secure.service=ghost"
      - "traefik.http.services.ghost.loadbalancer.server.port=2368"  # port of the service.
      - "traefik.docker.network=intranet"
      - "homepage.group=Other"
      - "homepage.name=Ghost"
      - "homepage.icon=/images/ghost.png"
      - "homepage.href=https://Ghost.${DOMAIN}/"
    dns:
      - ${DNS_SERVER1}
      - ${DNS_SERVER2}
    security_opt:
      - no-new-privileges:true  # helps to increase security

networks:
  ghost_network:
  intranet:
    external: true
